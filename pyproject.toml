[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-numpy-xor"
version = "0.3.0"
description = "A tiny neural network implemented from scratch in NumPy, demonstrated on the XOR problem and simple 2D toy datasets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Arthur7Li" },
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/Arthur7Li/tiny-nn-xor"

[tool.setuptools.packages.find]
include = ["nn_numpy*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E731",  # allow lambda assignment (used in a couple of test helpers)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
